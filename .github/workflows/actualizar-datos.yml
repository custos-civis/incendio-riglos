name: Actualizar datos y publicar el panel

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-datos-publicos
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Consultar Aragón Hoy, DGT, AEMET, ICEARAGON y EFFIS
        run: python scripts/update_public_data.py

      - name: Validar los archivos
        run: |
          python -m py_compile scripts/update_public_data.py
          for file in data/*.json data/*.geojson; do
            python -m json.tool "$file" > /dev/null
          done
          git diff --check

      - name: Publicar solo si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.geojson
          if git diff --cached --quiet; then
            echo "No hay cambios"
          else
            git commit -m "Actualizar todos los datos públicos"
            git push
          fi

      - name: Activar HTTPS del dominio personalizado cuando el certificado esté listo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if respuesta=$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pages" \
            -f cname="www.custoscivis.org" \
            -F https_enforced=true 2>&1); then
            echo "HTTPS está activado para www.custoscivis.org"
          elif echo "$respuesta" | grep -q "certificate does not exist yet"; then
            echo "El certificado de GitHub todavía está en provisión; se reintentará en la próxima actualización."
          else
            echo "$respuesta" >&2
            exit 1
          fi

